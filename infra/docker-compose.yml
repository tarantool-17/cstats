name: cstats

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cstats
      POSTGRES_USER: cstats
      POSTGRES_PASSWORD: cstats_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cstats -d cstats"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: cstats
      PGUSER: cstats
      PGPASSWORD: cstats_dev_password
    volumes:
      - ../database/migrations:/migrations:ro
    command:
      - sh
      - -c
      - for file in /migrations/*.sql; do echo "Applying $$file"; psql -v ON_ERROR_STOP=1 -f "$$file"; done
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../api/.env
    environment:
      DATABASE_URL: postgres://cstats:cstats_dev_password@postgres:5432/cstats
      IMAGE_STORAGE_ROOT: /data/images
    volumes:
      - telegram-images:/data/images
    depends_on:
      migrate:
        condition: service_completed_successfully

  extraction-worker:
    build:
      context: ../extraction-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://cstats:cstats_dev_password@postgres:5432/cstats
      IMAGE_STORAGE_ROOT: /data/images
      WORKER_POLL_INTERVAL_MS: "5000"
    volumes:
      - telegram-images:/data/images:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  telegram-images:
